name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# só a leitura do código; nenhum job aqui escreve no repositório
permissions:
  contents: read

concurrency:
  # um push novo na mesma branch cancela o run anterior
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: pytest (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      # -m slow fica de fora: as peças gold (docs/peças exemplo/) não são
      # versionadas, então a regressão real só roda na máquina do dev
      - run: pytest -v

  web:
    name: vitest + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - run: npm --prefix web test
      - run: npm --prefix web run build
